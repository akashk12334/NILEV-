<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nilev-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="nilev-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Brand Gradient -->
  <rect width="64" height="64" rx="16" fill="url(#nilev-grad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Centered NILEV Brand Heart -->
  <g transform="translate(12.8, 13.5) scale(1.6)">
    <path
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>