<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NILEV — Private Companion & Habit Platform</title>
    <!-- Preconnect & Pre-warm Backend -->
    <link rel="dns-prefetch" href="https://nilev.onrender.com" />
    <link rel="preconnect" href="https://nilev.onrender.com" crossorigin />
    <script>
      // Background pre-warming of backend container immediately when page starts loading
      try {
        fetch("https://nilev.onrender.com/api/v1/auth/ping", { mode: "no-cors", cache: "no-store" }).catch(() => {});
      } catch (e) {}
    </script>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#070913] text-slate-100 antialiased selection:bg-violet-600/30 selection:text-violet-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
